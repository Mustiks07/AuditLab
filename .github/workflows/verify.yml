name: Integration checks
on:
  push:
    branches: [main, integration/release]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Install accepted component dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Prepare verified offline wheels
        run: python -m pip download --require-hashes --only-binary=:all: --dest docker/wheels -r requirements.lock
      - name: Build the real policy sandbox without package network access
        run: docker build --network=none -f docker/runtime/Dockerfile -t auditlab-policy:ci .
      - name: Run available checks (incomplete release is reported explicitly)
        env:
          AUDITLAB_POLICY_IMAGE: auditlab-policy:ci
        run: python run.py verify --output artifacts/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: artifacts/ci/
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
