name: Integration checks
on:
  push:
    branches: [main, integration/release]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Record the clean checkout and exact PR merge parents
        run: python tools/review_evidence.py capture --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --output artifacts/review-context.json
      - name: Test Git review tooling (not required in the offline runtime)
        run: python -m unittest discover -s tests/release_tools -v
      - name: Install accepted component dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Prepare verified offline wheels
        run: |
          python -m pip download --require-hashes --only-binary=:all: --dest docker/wheels -r requirements.lock
      - name: Build the real policy sandbox without package network access
        run: docker build --network=none -f docker/runtime/Dockerfile -t auditlab-policy:ci .
      - name: Prepare and build the isolated research bridge
        run: |
          python -m pip download --require-hashes --only-binary=:all: --dest docker/wheels/bridge -r docker/bridge/requirements.lock
          docker build --network=none -f docker/bridge/Dockerfile -t auditlab-llm-bridge:ci .
      - name: Run available checks (incomplete release is reported explicitly)
        env:
          AUDITLAB_POLICY_IMAGE: auditlab-policy:ci
          AUDITLAB_BRIDGE_IMAGE: auditlab-llm-bridge:ci
        run: python run.py verify --include-research --timeout 300 --output artifacts/ci
      - name: Bind passing tests to the event head and base
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: python tools/review_evidence.py check --context artifacts/review-context.json --report artifacts/ci/report.json --expected-head "$REVIEW_HEAD" --expected-base "$REVIEW_BASE" --include-research --output artifacts/review-receipt.json
      - name: Test the independent shortcut and compatibility checkers
        run: |
          python -m unittest discover -s tests/data_shortcuts -v
          python -m unittest discover -s tests/jury_compatibility_v3 -v
      - name: Check local Genesis definitions and independent ID compatibility
        shell: bash
        run: |
          python review/genesis_acceptance/run.py --output artifacts/genesis-acceptance
          python -m review.jury_compatibility_v3.check_ids --generate --output artifacts/jury-v3/legacy
          python -m review.jury_compatibility_v3.gate \
            --genesis artifacts/genesis-acceptance/report.json \
            --ids artifacts/jury-v3/legacy/id-transform.json --expected-episodes 24 \
            --expected-commit "$GITHUB_SHA" | tee artifacts/jury-v3/legacy/gate.json
          python -m review.jury_compatibility_v3.check_ids --episodes datasets/open-1.3 --output artifacts/jury-v3/open-1.3
          python -m review.jury_compatibility_v3.gate \
            --genesis artifacts/genesis-acceptance/report.json \
            --ids artifacts/jury-v3/open-1.3/id-transform.json --expected-episodes 20 \
            --expected-commit "$GITHUB_SHA" | tee artifacts/jury-v3/open-1.3/gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: |
            artifacts/ci/
            artifacts/review-context.json
            artifacts/review-receipt.json
            artifacts/genesis-acceptance/report.json
            artifacts/genesis-acceptance/answers_before_truth.json
            artifacts/jury-v3/*/id-transform.json
            artifacts/jury-v3/*/gate.json
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
  offline-bundle:
    name: Build offline bundle
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/integration/release')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Build from a clean committed tree
        run: python tools/build_release.py --output build/ci-release
      - name: Check the built archive lists every image with its tag for both Docker stores
        run: python build/ci-release/offline.py check --bundle build/ci-release
      - uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-${{ github.sha }}
          path: build/ci-release/
          compression-level: 0
          retention-days: 14
  offline-rehearsal:
    name: Internal offline rehearsal (${{ matrix.image-store }})
    needs: offline-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image-store: [classic, containerd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Stop the default daemon before the isolated Docker 29.10 check
        if: matrix.image-store == 'containerd'
        run: sudo systemctl stop docker.service docker.socket
      - name: Install pinned Docker 29.10 with containerd image storage
        if: matrix.image-store == 'containerd'
        id: modern-docker
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5
        with:
          version: v29.10.0
          set-host: 'true'
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Expose the isolated daemon at the trusted controller socket
        if: matrix.image-store == 'containerd'
        env:
          DOCKER_SOCKET: ${{ steps.modern-docker.outputs.sock }}
        run: sudo ln -sf "${DOCKER_SOCKET#unix://}" /var/run/docker.sock
      - name: Verify the intended storage backend is actually active
        env:
          IMAGE_STORE: ${{ matrix.image-store }}
        run: |
          python - <<'PYSTORE'
          import json, os, subprocess
          info = json.loads(subprocess.check_output(['docker', 'info', '--format', '{{json .}}']))
          modern = 'io.containerd.snapshotter.v1' in str(info.get('DriverStatus'))
          assert modern == (os.environ['IMAGE_STORE'] == 'containerd'), info.get('DriverStatus')
          print(json.dumps({key: info.get(key) for key in ('ServerVersion', 'Driver', 'DriverStatus', 'CgroupVersion')}))
          PYSTORE
      - uses: actions/download-artifact@v4
        with:
          name: offline-bundle-${{ github.sha }}
          path: build/ci-release
      - name: Re-check the downloaded archive before loading it on this store
        run: python build/ci-release/offline.py check
      - name: Record that project images are absent on this host
        run: |
          python tools/check_clean_docker.py --manifest build/ci-release/manifest.json --output artifacts/offline-ci/preload.json
      - name: Execute with all container networks disabled
        id: exercise
        continue-on-error: true
        run: python build/ci-release/offline.py verify --suite rehearsal --output-root artifacts/offline-ci
      - name: Require complete internal measurements and actual resource limits
        run: python tools/check_rehearsal_evidence.py --results artifacts/offline-ci --bundle build/ci-release --expected-revision "$GITHUB_SHA" --output artifacts/offline-ci/evidence-summary.json
      - name: Verify the receiver command for resolving demo and replay image IDs
        run: |
          python - <<'PYIMAGES'
          import json, subprocess, sys
          from pathlib import Path
          launches = list(Path('artifacts/offline-ci').glob('verify-*/launch.json'))
          assert len(launches) == 1
          launch = json.loads(launches[0].read_text())
          resolved = {role: subprocess.check_output([sys.executable, 'build/ci-release/offline.py', 'image', '--role', role], text=True).strip() for role in ('runtime', 'policy', 'verifier')}
          assert resolved == {role: image['id'] for role, image in launch['loaded_images'].items()}
          # The containerd store names images only from OCI index annotations; both stores must keep every tag.
          tagged = {role: subprocess.check_output(['docker', 'image', 'inspect', image['tag'], '--format', '{{.Id}}'], text=True).strip() for role, image in launch['loaded_images'].items()}
          assert tagged == resolved, (tagged, resolved)
          Path('artifacts/offline-ci/resolved-images.json').write_text(json.dumps(resolved, indent=2))
          PYIMAGES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evidence-${{ matrix.image-store }}-${{ github.sha }}
          path: artifacts/offline-ci/
